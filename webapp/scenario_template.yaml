# CPS testbed scenario file. Upload it on the "Experiments" page of the dashboard.
# Every field is optional; the value shown is the default unless marked "example".
# Several experiments can go in one file under `scenarios:` (see the end of this file).

name: gen-fault-fdi          # example; letters, digits, _ and -, up to 40 characters
grid: ieee118                # ieee14, ieee30, ieee39, ieee57, ieee118, ieee300, or the id of an uploaded grid
duration: 10                 # simulated seconds (1-120)
mode: qss                    # qss = GridPACK power flow every grid_step (quasi-steady state);
                             # dynamic = GridPACK dynamic simulation: generators, exciters and governors
                             # integrated every few ms, faults and trips, frequency (needs solver: gridpack)
grid_step: 0.5               # qss: power flow interval (s); dynamic: default one PMU frame (1/rate)
solver: gridpack             # gridpack (MPI on the cluster) or builtin (Python Newton-Raphson, qss only)
mpi_np: 4                    # example; number of MPI ranks GridPACK runs on (default: the cluster setting)
seed: 1                      # random seed for link delays, noise and losses

pmu:
  placement: minimum         # minimum = fewest PMUs for full observability; redundant = every bus seen twice
  rate: 30                   # frames per second per PMU
  noise_mag: 0.001           # relative magnitude noise std-dev (0..0.05)
  noise_ang: 0.001           # angle noise std-dev in radians (0..0.05)

network:                     # every PMU has its own link to the PDC
  latency_ms: 10             # mean one-way delay
  latency_spread: 0.5        # each link's delay is drawn within +/- this fraction of the mean
  jitter_ms: 2               # extra random delay per frame, 0..jitter_ms
  loss: 0.0                  # probability that a frame is lost (0-0.9)
  pdc_wait_ms: 20            # how long the PDC waits for late frames of a time stamp

event:                       # a disturbance in the grid
  type: avr_fault            # example; none | avr_fault | load_step (qss only)
                             #   | bus_fault | line_trip | gen_trip (dynamic only)
  bus: 49                    # example; generator bus (avr_fault, gen_trip), load bus (load_step),
                             # faulted bus (bus_fault) or one end of the line (line_trip)
  to: 50                     # example; line_trip: the other end of the line
  vset: 1.12                 # avr_fault: faulty voltage setpoint (pu)
  pct: 20                    # load_step: load change in percent
  duration: 0.1              # bus_fault: three-phase fault cleared after this many seconds
  t: 4                       # when it happens (s)

attack:
  type: fdi-simple           # example; none | fdi-simple | fdi-stealthy | delay | drop
  target: 49                 # example; bus to hide (empty = highest-voltage bus)
  fake: 1.02                 # example; voltage the attacker wants the control center to see (pu)
  start: 4                   # attack window (s)
  end: 9
  delay_ms: 100              # delay attack only

control:
  bdd: true                  # chi-square bad data detection with removal of suspicious PMUs
  voltage_control: true      # send generator setpoint commands on voltage violations
  vmin: 0.94
  vmax: 1.08
  se_sigma: null             # null = sqrt((noise_mag^2 + noise_ang^2)/2), 0.001 by default;
                            # positive value overrides relative rectangular per-component std-dev

# Several experiments in one file: the fields above are shared, each entry overrides them.
# scenarios:
#   - name: no-attack
#     attack: {type: none}
#   - name: stealthy
#     attack: {type: fdi-stealthy}
#   - name: mpi-8
#     mpi_np: 8
#   - name: fault-dynamic          # IEEE 39-bus with its published machine data
#     grid: ieee39
#     mode: dynamic
#     event: {type: bus_fault, bus: 16, duration: 0.1, t: 2}
#     attack: {type: none}
